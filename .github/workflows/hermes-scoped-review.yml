name: Hermes scoped contribution review
on:
  push:
    branches: [ci/hermes-overnight-review-20260915]
permissions:
  contents: read
jobs:
  regression-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
      - name: Install pinned dependencies
        run: uv sync --locked --python 3.12 --extra all --extra dev
      - name: Verify fixes and reproduce baseline failures
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-contribution-review
        run: python .github/hermes-scoped-review.py
