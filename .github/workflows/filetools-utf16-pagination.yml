name: Filetools UTF-16 pagination validation

on:
  push:
    branches:
      - ci/filetools-utf16-pagination

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/filetools-venv
      UV_CACHE_DIR: ${{ runner.temp }}/filetools-uv-cache
      HERMES_PYTHON: ${{ runner.temp }}/filetools-venv/bin/python
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          clean: false
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: false
      - name: Install locked test dependencies
        run: uv sync --locked --python 3.11 --extra dev
      - name: Run UTF-16 regression through canonical runner
        run: scripts/run_tests.sh tests/tools/test_utf16_pagination.py tests/tools/test_utf16_read.py -j 2 --file-retries 0
