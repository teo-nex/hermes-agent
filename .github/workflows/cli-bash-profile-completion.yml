name: CLI Bash profile completion validation

on:
  push:
    branches:
      - ci/cli-bash-profile-completion

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact contribution commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: c4364befeebfc6f9c4b7091dda7e2da2f689e4c4
          fetch-depth: 2
          clean: false
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: false

      - name: Install locked test dependencies
        run: uv sync --locked --python 3.11 --extra dev

      - name: Run regression and existing completion tests
        run: |
          scripts/run_tests.sh tests/hermes_cli/test_bash_profile_completion.py tests/hermes_cli/test_completion.py -j 2 --file-retries 0 -q

      - name: Exercise the real CLI-generated completion in Bash
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-completion-smoke
          HERMES_DISABLE_LAZY_INSTALLS: "1"
        run: |
          mkdir -p "$HERMES_HOME"
          .venv/bin/python -m hermes_cli.main completion bash > "$RUNNER_TEMP/hermes-completion.bash"
          bash --noprofile --norc -s "$RUNNER_TEMP/hermes-completion.bash" <<'BASH'
          source "$1"
          COMP_WORDS=(hermes -p default sessions l)
          COMP_CWORD=4
          _hermes_completion
          [[ " ${COMPREPLY[*]} " == *" list "* ]] || exit 1
          printf 'sessions with -p: %s\n' "${COMPREPLY[*]}"
          COMP_WORDS=(hermes --profile = default chat --)
          COMP_CWORD=5
          _hermes_completion
          [[ " ${COMPREPLY[*]} " == *" --query "* ]] || exit 1
          printf 'chat with --profile=: %s\n' "${COMPREPLY[*]}"
          BASH

      - name: Check lint and whitespace
        run: |
          .venv/bin/ruff check hermes_cli/completion.py tests/hermes_cli/test_bash_profile_completion.py
          git diff --check 49c6d4a9e0dddc64d6333c5b1fcc9d911463a8fd HEAD
